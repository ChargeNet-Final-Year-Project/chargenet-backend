name: backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chargenet
          POSTGRES_PASSWORD: chargenet
          POSTGRES_DB: chargenet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chargenet -d chargenet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://chargenet:chargenet@localhost:5432/chargenet_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l ./cmd ./internal ./scripts)"
      - run: go vet ./...
      - run: go test -race -count=1 -p 1 ./...
      - run: go build ./...
