services:
  db:
    image: postgres:16-alpine
    container_name: chargenet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chargenet
      POSTGRES_PASSWORD: chargenet
      POSTGRES_DB: chargenet
    ports:
      - "5432:5432"
    volumes:
      - chargenet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargenet -d chargenet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chargenet_pgdata:
